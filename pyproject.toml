[project]
name = "djangollm-tests"
version = "0.1.0"
description = "Project to test Django LLM Chat application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.8",
    "django-click>=2.4.1",
    "django-llm-chat",
    "litellm>=1.80.0",
]

[tool.uv.sources]
django-llm-chat = { path = "../django-llm-chat", editable = true }

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ptpython>=3.0.32",
    "pytest>=9.0.1",
    "pytest-django>=4.11.1",
    "rich>=14.2.0",
]
